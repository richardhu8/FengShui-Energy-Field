<title>外环境立极尺</title>
<style>
:root{
  --ground:#E7E1D2; --panel:#F3EEE2; --panel-2:#EAE4D5; --edge:#CFC5AC;
  --ink:#17130F; --ink-2:#4A4136; --ink-3:#7C7161;
  --brass:#8A6A1F; --cinnabar:#AE3527; --jade:#3D6A57;
  --lacquer:#14120E; --lacquer-ink:#E8E1CE;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#100E0B; --panel:#191712; --panel-2:#211E18; --edge:#332E24;
  --ink:#E9E2CF; --ink-2:#B3A992; --ink-3:#7E7562;
  --brass:#C9A24A; --cinnabar:#CE5041; --jade:#6BA189;
  --lacquer:#0B0A08; --lacquer-ink:#E9E2CF;}}
:root[data-theme="dark"]{
  --ground:#100E0B; --panel:#191712; --panel-2:#211E18; --edge:#332E24;
  --ink:#E9E2CF; --ink-2:#B3A992; --ink-3:#7E7562;
  --brass:#C9A24A; --cinnabar:#CE5041; --jade:#6BA189;
  --lacquer:#0B0A08; --lacquer-ink:#E9E2CF;}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
.serif{font-family:"Songti SC","STSong","Source Han Serif SC",SimSun,serif}
header{background:var(--lacquer);color:var(--lacquer-ink);padding:16px 22px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:2px solid var(--brass)}
header .mark{font-family:"Songti SC","STSong",SimSun,serif;font-size:19px;letter-spacing:.22em;color:var(--brass)}
header .name{font-family:"Songti SC","STSong",SimSun,serif;font-size:16px;letter-spacing:.1em}
main{max-width:1180px;margin:0 auto;padding:20px;
  display:grid;grid-template-columns:1fr minmax(260px,300px);gap:18px;align-items:start}
@media(max-width:860px){main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:3px}
.pad{padding:14px 16px}
h2{margin:0 0 2px;font-size:13px;letter-spacing:.14em;font-weight:600;
  font-family:"Songti SC","STSong",SimSun,serif}
.hint{margin:0 0 12px;font-size:11.5px;color:var(--ink-3)}
#stage{position:relative;width:100%;aspect-ratio:1/1;background:var(--panel-2);
  border-radius:3px;overflow:hidden;touch-action:none}
#map{position:absolute;inset:0}
#backImg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:none}
#ruler{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.readout{background:var(--panel-2);border:1px solid var(--edge);border-radius:2px;padding:10px 12px;margin-top:10px}
.readout .big{font-family:"Songti SC","STSong",SimSun,serif;font-size:26px;letter-spacing:.06em}
.readout .meta{font-size:11.5px;color:var(--ink-3);margin-top:2px}
label{display:block;font-size:11.5px;color:var(--ink-3);letter-spacing:.08em;margin:10px 0 3px}
input[type=range]{width:100%;accent-color:var(--cinnabar);background:none;border:none;padding:0}
input[type=text]{width:100%;padding:6px 9px;background:var(--panel-2);color:var(--ink);
  border:1px solid var(--edge);border-radius:2px;font:inherit}
.tool{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.tool button,.filebtn{font:inherit;font-size:11.5px;padding:5px 11px;background:var(--panel-2);
  color:var(--ink-2);border:1px solid var(--edge);border-radius:2px;cursor:pointer}
.tool button:hover,.filebtn:hover{border-color:var(--brass);color:var(--brass)}
.tool button.primary{background:var(--brass);color:var(--lacquer);border-color:var(--brass);font-weight:600}
.note{font-size:11.5px;color:var(--ink-3);margin-top:10px}

/* ═══ 工作台布局：≥1100px 整页不滚，各栏独立滚动 ═══ */
@media(min-width:1100px){
  html,body{height:100%;overflow:hidden}
  body{display:flex;flex-direction:column}
  header{flex:none}
  main{flex:1;min-height:0;max-width:none;width:100%;padding:14px 16px;gap:14px;
       align-items:stretch}
  main>*{min-height:0;overflow-y:auto;overflow-x:hidden;padding-right:6px;scrollbar-width:thin}
  main>*::-webkit-scrollbar{width:7px}
  main>*::-webkit-scrollbar-thumb{background:var(--edge);border-radius:4px}
  footer{flex:none;margin:0;max-width:none;padding:6px 16px;font-size:10.5px;line-height:1.45;
         border-top:1px solid var(--edge);background:var(--panel);
         max-height:2.9em;overflow-y:auto}
}
footer{max-width:1180px;margin:0 auto;padding:0 20px 40px;font-size:11.5px;color:var(--ink-3)}
nav.site{display:flex;gap:2px;margin-left:auto;align-items:center;flex-wrap:wrap}
nav.site a{font-size:11.5px;letter-spacing:.1em;color:#9A8F78;text-decoration:none;
  padding:4px 10px;border-radius:2px;white-space:nowrap}
nav.site a:hover{color:var(--brass)}
nav.site a[aria-current="page"]{color:var(--lacquer);background:var(--brass);font-weight:600}
</style>

<header>
  <span class="mark">立极</span><span class="name">外环境定向</span>
  <nav class="site"><a href="site/index.html">门户</a><a href="玄空飞星排盘.html">排盘</a><a href="炁流场3D.html">炁流场</a><a href="外环境立极尺.html" aria-current="page">立极尺</a><a href="八字命书.html">命书</a><a href="合盘.html">合盘</a><a href="六爻纳甲.html">六爻</a><a href="寻炁-技术拆解.html">竞品拆解</a></nav>
</header>

<main>
  <div class="card pad">
    <div id="stage">
      <div id="map"></div>
      <img id="backImg" alt="外环境底图">
      <svg id="ruler" viewBox="0 0 400 400" preserveAspectRatio="none"></svg>
    </div>
    <p class="note" id="mapNote"></p>
  </div>

  <div class="card pad">
    <h2>立极尺</h2>
    <p class="hint">把尺子中心放在住宅上，转动使其与<b>房屋朝向轴</b>对齐 —— 箭头指屋外</p>

    <div class="readout">
      <div class="big serif" id="deg">—</div>
      <div class="meta" id="shan"></div>
    </div>

    <label for="rot">精调朝向 <b id="rotV">0.0°</b></label>
    <input id="rot" type="range" min="0" max="359.5" step="0.5" value="0">
    <label for="len">尺长 <b id="lenV">120</b></label>
    <input id="len" type="range" min="50" max="190" step="5" value="120">

    <div class="tool">
      <button id="lock" class="primary">锁定为向首</button>
      <button id="center">回到中心</button>
    </div>

    <h2 style="margin-top:20px">底图</h2>
    <p class="hint">在线地图不可用时，可上传卫星截图或总平面图代替</p>
    <input id="q" type="text" placeholder="搜索地址后回车（需联网）">
    <div class="tool">
      <label class="filebtn" for="file">上传底图</label>
      <input id="file" type="file" accept="image/*" style="display:none">
      <button id="dropImg">移除底图</button>
    </div>
    <p class="note" id="upState"></p>
  </div>
</main>

<footer>
  地图仅用于<b>人工观察</b>道路、水系、周边建筑与朝向，不自动输出风水结论。
  卫星影像与实际朝向可能有偏差，且地图为<b>真北</b>坐标 —— 与实体罗盘的磁北读数相差一个磁偏角，
  两者比对时请注意。精确定向仍建议以实测罗盘为准。
</footer>

<script>
/* ═══ 二十四山 ═══ */
const M24=[["壬",345],["子",0],["癸",15],["丑",30],["艮",45],["寅",60],
["甲",75],["卯",90],["乙",105],["辰",120],["巽",135],["巳",150],
["丙",165],["午",180],["丁",195],["未",210],["坤",225],["申",240],
["庚",255],["酉",270],["辛",285],["戌",300],["乾",315],["亥",330]];
const norm=d=>((d%360)+360)%360;
function shanOf(d){d=norm(d);
  for(const m of M24){const lo=norm(m[1]-7.5),hi=norm(m[1]+7.5);
    if(lo<hi){if(d>=lo&&d<hi)return m}else{if(d>=lo||d<hi)return m}}
  return M24[0];}

const $=id=>document.getElementById(id);
let ST={cx:200,cy:200,rot:0,len:120};
try{const d=localStorage.getItem("fs_deg"); if(d!==null)ST.rot=norm(+d);}catch(e){}

/* ═══ 立极尺绘制 ═══ */
const NS="http://www.w3.org/2000/svg";
const el=(n,a)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e;};
function draw(){
  const s=$("ruler"); s.textContent="";
  const {cx,cy,rot,len}=ST;
  const r=(rot-90)*Math.PI/180;
  const fx=cx+len*Math.cos(r), fy=cy+len*Math.sin(r);
  const bx=cx-len*Math.cos(r), by=cy-len*Math.sin(r);
  // 罗盘环
  s.appendChild(el("circle",{cx,cy,r:len*0.55,fill:"rgba(20,18,14,.30)",
    stroke:"var(--brass)","stroke-width":1}));
  for(let a=0;a<360;a+=15){
    const t=(a-90)*Math.PI/180, R1=len*0.55, R2=len*0.55-(a%45===0?9:5);
    s.appendChild(el("line",{x1:cx+R1*Math.cos(t),y1:cy+R1*Math.sin(t),
      x2:cx+R2*Math.cos(t),y2:cy+R2*Math.sin(t),
      stroke:"rgba(201,162,74,.75)","stroke-width":.9}));
  }
  // 二十四山名
  M24.forEach(([nm,a])=>{
    const t=(a-90)*Math.PI/180, R=len*0.55-16;
    const tx=el("text",{x:cx+R*Math.cos(t),y:cy+R*Math.sin(t),"text-anchor":"middle",
      "dominant-baseline":"central","font-size":8.5,
      "font-family":'"Songti SC","STSong",SimSun,serif',
      fill:nm===shanOf(rot)[0]?"#F0D9A0":"rgba(201,162,74,.8)"});
    tx.textContent=nm; s.appendChild(tx);
  });
  // 坐向轴（朱砂）
  s.appendChild(el("line",{x1:bx,y1:by,x2:fx,y2:fy,stroke:"var(--cinnabar)","stroke-width":2.5}));
  // 向首箭头
  const a1=(rot-90+150)*Math.PI/180, a2=(rot-90-150)*Math.PI/180;
  s.appendChild(el("polygon",{points:
    `${fx},${fy} ${fx+13*Math.cos(a1)},${fy+13*Math.sin(a1)} ${fx+13*Math.cos(a2)},${fy+13*Math.sin(a2)}`,
    fill:"var(--cinnabar)"}));
  const lb=el("text",{x:fx,y:fy-14,"text-anchor":"middle","font-size":10,fill:"var(--cinnabar)"});
  lb.textContent="向"; s.appendChild(lb);
  // 把手
  s.appendChild(el("circle",{cx:fx,cy:fy,r:14,fill:"transparent","data-h":"rot",style:"cursor:grab"}));
  s.appendChild(el("circle",{cx,cy,r:18,fill:"transparent","data-h":"move",style:"cursor:move"}));
  s.appendChild(el("circle",{cx,cy,r:4,fill:"var(--brass)"}));
  // 指北
  const n=el("text",{x:12,y:18,"font-size":11,fill:"var(--brass)"});
  n.textContent="↑ 真北"; s.appendChild(n);

  const sh=shanOf(rot);
  $("deg").textContent=rot.toFixed(1)+"°";
  const zuo=shanOf(rot+180);
  $("shan").innerHTML=`向首 <b>${sh[0]}</b>　坐山 <b>${zuo[0]}</b>　→ <b>${zuo[0]}山${sh[0]}向</b>`;
  $("rot").value=rot; $("rotV").textContent=rot.toFixed(1)+"°";
  $("lenV").textContent=len;
}

/* ═══ 交互 ═══ */
let mode=null;
const svg=$("ruler");
function toSvg(e){const r=svg.getBoundingClientRect();
  return[(e.clientX-r.left)/r.width*400,(e.clientY-r.top)/r.height*400];}
svg.addEventListener("pointerdown",e=>{
  const h=e.target.getAttribute&&e.target.getAttribute("data-h");
  if(!h)return;
  mode=h; try{svg.setPointerCapture(e.pointerId)}catch(_){}
  e.preventDefault();
});
svg.addEventListener("pointermove",e=>{
  if(!mode)return;
  const[x,y]=toSvg(e);
  if(mode==="move"){ST.cx=Math.max(20,Math.min(380,x));ST.cy=Math.max(20,Math.min(380,y));}
  else{ST.rot=norm(Math.atan2(y-ST.cy,x-ST.cx)*180/Math.PI+90);}
  draw();
});
const endP=()=>{mode=null;};
svg.addEventListener("pointerup",endP);
svg.addEventListener("pointercancel",endP);

$("rot").addEventListener("input",e=>{ST.rot=+e.target.value;draw();});
$("len").addEventListener("input",e=>{ST.len=+e.target.value;draw();});
$("center").addEventListener("click",()=>{ST.cx=200;ST.cy=200;draw();});
$("lock").addEventListener("click",()=>{
  try{localStorage.setItem("fs_deg",ST.rot.toFixed(1));}catch(e){}
  $("upState").innerHTML=`已锁定 <b>${ST.rot.toFixed(1)}°</b> —— `+
    `<a href="paipan.html" style="color:var(--brass)">到排盘页查看飞星盘 →</a>`;
});

/* ═══ 底图：上传 ═══ */
$("file").addEventListener("change",e=>{
  const f=e.target.files&&e.target.files[0]; if(!f)return;
  const url=URL.createObjectURL(f);
  const im=$("backImg"); im.src=url; im.style.display="block";
  $("map").style.display="none";
  $("upState").textContent="已载入底图 —— 请确认图是正北朝上，否则读数会偏";
});
$("dropImg").addEventListener("click",()=>{
  $("backImg").style.display="none"; $("backImg").src="";
  $("map").style.display=""; $("upState").textContent="";
});

/* ═══ 底图：在线地图（自建部署时可用；Artifact 版受 CSP 限制会失败）═══ */
(function initMap(){
  const note=$("mapNote");
  const css=document.createElement("link");
  css.rel="stylesheet"; css.href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";
  document.head.appendChild(css);
  const js=document.createElement("script");
  js.src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
  js.onload=()=>{
    try{
      const map=L.map("map",{zoomControl:true,attributionControl:true}).setView([39.9087,116.3975],18);
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
        {maxZoom:19,attribution:"© OpenStreetMap contributors"}).addTo(map);
      note.innerHTML="在线地图已就绪 · 拖动地图定位到你的楼栋，再用立极尺对齐朝向轴";
      $("q").addEventListener("keydown",ev=>{
        if(ev.key!=="Enter")return;
        const q=$("q").value.trim(); if(!q)return;
        $("upState").textContent="搜索中…";
        fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&q="+encodeURIComponent(q))
          .then(r=>r.json()).then(a=>{
            if(!a.length){$("upState").textContent="没找到这个地址";return;}
            map.setView([+a[0].lat,+a[0].lon],18);
            $("upState").textContent=a[0].display_name.slice(0,60);
          }).catch(()=>{$("upState").textContent="搜索失败（可能被网络策略拦截）";});
      });
    }catch(e){ note.textContent="地图初始化失败："+e.message; }
  };
  js.onerror=()=>{
    note.innerHTML='<span style="color:var(--cinnabar)">在线地图不可用</span> —— '+
      '当前托管环境禁止加载外部脚本（Artifact 版即如此）。'+
      '请改用「上传底图」：截一张正北朝上的卫星图即可照常量取朝向。';
  };
  document.head.appendChild(js);
})();

draw();
</script>
